name: mirrortalk_mvp
description: Minimal buildable app with DaySummary + Journal
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  speech_to_text: ^6.6.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
